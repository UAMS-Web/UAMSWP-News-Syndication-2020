# Public repository: Actions minutes are free, so this workflow is the remote
# gate. Private UAMS-Web repositories gate the same jobs behind RUN_REMOTE_CI
# and validate with the shared local CI runner instead.
#
# The checks are the shared chain in UAMS-Web/uams-ci-workflows, called as
# `checks` at a pinned release tag (it moves only when this line does).
# PHP 8.4 is the development PHP (`config.platform.php` in composer.json); the
# lock resolves for it, so an older runner PHP cannot install it.
#
# `CI` is the one check a ruleset requires. It needs the call: a job added
# beside the call changes its `needs:` in the same change.
name: CI

on:
  push:
    branches: [master, staging, dev]
  pull_request:
  workflow_dispatch:
  # The weekly full mutation pass: a scheduled run mutates everything `composer mutate` covers, under the
  # shared chain's `mutate-full-timeout-minutes` (default 180), to catch drift from a dependency or tooling
  # change that no pull request touches. A schedule runs on the default branch, and GitHub disables it after
  # 60 days without repository activity.
  schedule:
    - cron: '17 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.10.1
    with:
      linux-only: true
      pest-command: composer test:unit
      mutate-paths: includes
      mutate-ignore-paths: includes
      floor-lint: true
      floor-lint-php: '8.2'
      floor-lint-command: >-
        find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './.*/*' -print0
        | xargs -0 -r -n1 php -l
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs

  ci:
    name: CI
    needs: [checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
